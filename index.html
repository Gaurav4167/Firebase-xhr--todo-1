<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Todo Form-2</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="card mt-5">
                    <div class="card-body">
                        <form id="todoForm">
                            <div class="form-group">
                                <label for="inputControl"><img id="flower-img" src="./assets/images/flower2.png" alt=""><b>Flower</b></label>
                                <input type="text" id="inputControl" class="form-control" placeholder="Flower-Name">

                                <button type="submit" id="addBtn" class="btn btn-primary btn-sm mt-4  btn-block">Add
                                    Todo</button>
                                <button type="button" id="updateBtn"
                                    class="btn btn-primary btn-sm mt-4  btn-block d-none">Update Todo</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card mt-5">
                    <h4 class="ml-3" id="flower-list-heading">Flowers todo list</h4>

                    <div class="card-body" id="addTodoCard">
                        <!-- <ul id="todoList" class="list-group">
                            <li class="list-group-item d-flex justify-content-between align-item-center"><strong>Rose </strong>
                        <div>
                            <i id="editBtn" role="button" class="fa-solid fa-pen-to-square text-primary"></i>
                            <i id="deleteBtn" role="button" class="fa-solid fa-trash-can text-danger ml-4"></i>
                        </div>
                        </li>
                        </ul> -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
